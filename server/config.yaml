# ============================================================
# 闲置资源优选推送 · 服务端配置（M1）
# 所有阈值集中于此，改配置不改代码
# ============================================================

app:
  name: 闲置资源优选
  timezone: Asia/Shanghai

# 分类与筛选
filter:
  geo_mode: nationwide        # nationwide=全国全量（已确认）；后续可切 focus_provinces
  focus_provinces: []         # 若 geo_mode=focus，填省份名，如 ["江苏","浙江","上海"]
  bc_threshold_wan: 300       # B/C 分类金额阈值（万元）；原属企业的大宗资产≤此值归 BC 双推
  personal_asset_types: [二手车, 二手设备, 闲置资产, 招租, 房产]
  business_asset_types: [土地, 矿业权, 股权, 债权]

# 评分权重（百分制，详见开发文档 §5.3/5.4）
scoring:
  business:
    clear_title: 20           # 权属/证照清晰线索
    use_match: 15
    size_fit: 10
    price_reasonable: 20
    no_encumbrance: 15
    no_eco_burden: 10
    reliable_seller: 10
    time_left: 5
  personal:
    discount_le_085: 30
    discount_le_095: 18
    discount_le_100: 8
    discount_gt_120: -15
    residential_low_unit: 20
    second_listing: 12
    seller_gov: 9
    seller_exchange: 6
    seller_enterprise: 3
    deadline_ok: 5
    deadline_expired: -20
    defect_note: -3
  residential_unit_threshold: 5000   # 住宅低单价阈值 元/㎡
  non_residential_keywords: [车库, 车位, 商铺, 商业, 经营性, 厂房, 仓库, 办公楼, 写字楼, 市场, 门店, 铺面, 粮站, 工业, 车间, 土地使用权, 棚, 场地, 商住楼]

# ============================================================
# v2 性价比/风险综合评分（融合为单一 score，0-100 越高越好）
# 五维度 value/title/risk/seller/time，按 asset_type 走不同权重；
# 每类资产可单独覆盖关键词和风险扣分。详见 scoring/value_scorer.py。
# ============================================================
value_scoring:
  enabled: true                 # false 时回退到上面旧的 B/C 评分
  discount_bands:               # 挂牌价 / 市场基准
    - {max: 0.50, score: 95, label: "五折以下"}
    - {max: 0.70, score: 85, label: "七折以下"}
    - {max: 0.85, score: 72, label: "八五折以下"}
    - {max: 1.00, score: 58, label: "不高于基准"}
    - {max: 1.20, score: 38, label: "略高于基准"}
    - {max: null, score: 12, label: "明显超市场价值"}
  seller_grades: &seller_grades
    "人民政府|管委会|管理委员会|国资|财政局|街道办|镇政府": ["政府/国资", 92]
    "产权交易|交易所|交易中心|产权服务": ["产权机构", 84]
    "银行|保险|资产管理|信托": ["金融机构", 74]
    "拍卖": ["拍卖机构", 72]
  time_bands: &time_bands
    - {min: 30, max: null, score: 92, label: "剩余30天以上"}
    - {min: 7,  max: 30,   score: 80, label: "剩余7-30天"}
    - {min: 3,  max: 7,    score: 65, label: "剩余3-7天"}
    - {min: 0,  max: 3,    score: 50, label: "不足3天"}
    - {min: null, max: 0,  score: 15, label: "已截止"}

  profiles:
    # 房产：价格/权属权重高
    房产:
      weights: {value: 0.38, title: 0.22, risk: 0.22, seller: 0.08, time: 0.10}
      title: {base: 60, positive: [不动产权证, 权属清晰, 有证, 商品房, 住宅], negative: [无证, 划拨, 临时建筑, 违章]}
      risk:  {base: 76, keywords: [抵押, 查封, 冻结, 诉讼, 纠纷, 凶宅, 瑕疵, 占用, 长期租赁], step: 11}
    # 土地：权属与治理义务权重高
    土地:
      weights: {value: 0.30, title: 0.28, risk: 0.25, seller: 0.10, time: 0.07}
      title: {base: 58, positive: [出让, 国有建设用地, 权属清晰, 有证], negative: [划拨, 集体土地, 未取得, 权属不清]}
      risk:  {base: 74, keywords: [抵押, 查封, 生态修复, 治理义务, 复垦, 污染, 纠纷, 在租], step: 12}
    # 矿业权：治理义务和出让合规是关键，几乎无价格基准
    矿业权:
      weights: {value: 0.12, title: 0.30, risk: 0.38, seller: 0.12, time: 0.08}
      title: {base: 55, positive: [挂牌出让, 出让, 探矿权, 采矿权, 权属清晰], negative: [无证, 越界, 争议, 未取得]}
      risk:  {base: 72, keywords: [生态修复, 治理义务, 复垦, 矿坑, 污染, 地质灾害, 纠纷, 查封, 抵押], step: 14}
    # 二手车/设备：价格权重高，关注报废瑕疵
    二手车:
      weights: {value: 0.42, title: 0.10, risk: 0.30, seller: 0.10, time: 0.08}
      risk:  {base: 78, keywords: [报废, 事故, 泡水, 大修, 瑕疵, 查封, 抵押], step: 13}
    二手设备:
      weights: {value: 0.42, title: 0.10, risk: 0.30, seller: 0.10, time: 0.08}
      risk:  {base: 78, keywords: [报废, 故障, 老旧, 瑕疵, 查封, 抵押], step: 13}
    # 股权/债权：关注底层债务和卖方
    股权:
      weights: {value: 0.30, title: 0.15, risk: 0.32, seller: 0.15, time: 0.08}
      risk:  {base: 72, keywords: [债务, 担保, 被执行, 诉讼, 亏损, 资不抵债, 纠纷], step: 13}
    债权:
      weights: {value: 0.35, title: 0.12, risk: 0.33, seller: 0.12, time: 0.08}
      risk:  {base: 70, keywords: [不良, 呆账, 被执行人, 无财产, 诉讼, 担保, 纠纷], step: 14}
    增资扩股:
      weights: {value: 0.28, title: 0.15, risk: 0.32, seller: 0.17, time: 0.08}
    招租:
      weights: {value: 0.34, title: 0.16, risk: 0.20, seller: 0.10, time: 0.20}
      risk:  {base: 78, keywords: [在租, 占用, 纠纷, 临时, 无证], step: 12}
    闲置资产:
      weights: {value: 0.38, title: 0.14, risk: 0.26, seller: 0.12, time: 0.10}
      risk:  {base: 76, keywords: [报废, 故障, 老旧, 瑕疵, 查封, 抵押, 无产权, 纠纷], step: 13}
    工美藏品:
      weights: {value: 0.42, title: 0.12, risk: 0.28, seller: 0.12, time: 0.06}
      risk:  {base: 74, keywords: [仿品, 瑕疵, 赝品, 争议], step: 16}
    在建工程:
      weights: {value: 0.28, title: 0.24, risk: 0.32, seller: 0.10, time: 0.06}
      risk:  {base: 68, keywords: [烂尾, 停工, 债务, 查封, 抵押, 纠纷], step: 14}
    其他:
      weights: {value: 0.32, title: 0.16, risk: 0.28, seller: 0.14, time: 0.10}
    default:
      weights: {value: 0.32, title: 0.16, risk: 0.28, seller: 0.14, time: 0.10}
      seller: {base: 55, grades: *seller_grades}
      time:   {base: 60, no_deadline: 60, bands: *time_bands}
      risk:   {base: 75, keywords: [抵押, 查封, 冻结, 诉讼, 纠纷, 债务, 担保, 被执行, 生态修复, 治理义务, 复垦, 污染, 瑕疵], step: 12}
      title:  {base: 60, positive: [出让, 权属清晰, 有证, 不动产权证], negative: [无证, 划拨, 权属不清]}

# 每日优选
selection:
  top_n_per_category: 10
  push_new_and_changed: true  # 变更即推
  change_fields: [price_yuan, deadline, status]
  run_time: "07:30"           # 每日定时

# 数据源开关与采集礼仪
# group=open     无反爬：按注册顺序连续抓，站点间不额外等待
# group=throttled 有限流/反爬：轮询抓取，同一站点两次任务间隔 cooldown_sec 秒
sources:
  land_market:
    enabled: true
    group: open
    base: https://market.mnr.gov.cn/api
    request_interval_sec: 0.3
  mining:
    enabled: true
    group: open
    base: https://ky.mnr.gov.cn/
    request_interval_sec: 0.2
    max_pages_per_column: 3
  ejy:
    enabled: true
    group: open
    base: https://www.ejy365.com
    request_interval_sec: 0.15
    max_detail_workers: 8
    categories: [FC, CL, ESSB, WZ, FCZZ, GQ, ZQ, TD]
  ggzy:
    enabled: true             # 纳入反爬组启用测试：列表风控时优雅降级，靠冷却后重试
    group: throttled
    cooldown_sec: 120         # 同一站点两次采集任务至少间隔 2 分钟
    max_attempts: 2           # 每轮最多尝试 2 次（间隔 2 分钟），避免无限重试
    base: https://www.ggzy.gov.cn
    request_interval_sec: 0.5
    page_size: 20
    max_pages: 1
    detail_limit: 10
  rmfysszc:
    enabled: true             # 人民法院诉讼资产网：列表 www1 接口 + 详情页静态页，无反爬
    group: open
    request_interval_sec: 0.4
    max_pages: 3              # 列表页数（每页约 21 条当日公告）
    max_detail: 60            # 每轮最多抓多少详情页
    fresh_days: 7             # 只保留发布日期在 N 天内的公告

  # 第二批：国资委认定产权交易机构（静态列表/公开 JSON 接口，低频抓取）
  # 注意：内蒙古/新疆/黑龙江等已在 ejy365 子站，由 ejy 源覆盖，不重复接入。
  wuhan_ovupre:
    enabled: true             # 武汉光谷联合产权交易所 /index/new_getxxmm.html
    group: open
    base: https://ovupre.com
    request_interval_sec: 0.5
    indexes: [2, 1, 3]        # 2=实物资产转让 1=产权转让 3=企业增资
    pages: 2
    page_size: 20
  qinghai_cqjy:
    enabled: true             # 青海省产权交易市场 /item.do 列表（GBK）
    group: open
    base: http://www.qhcqjy.com
    request_interval_sec: 0.6
    ass_list: ["01", "02", "03", "07", "16"]
    pages: 2
    max_detail: 60
  guizhou_cqjy:
    enabled: true             # 贵州阳光产权交易所 /project/ 静态列表
    group: open
    base: https://www.prechina.net
    request_interval_sec: 0.5
    pages: 3
  shenzhen_sotcbb:
    enabled: true             # 深圳联合产权交易所 POST /api/v1/sotcbb/local/project/list
    group: open
    api: https://www.sotcbb.com/api/v1/sotcbb/local/project/list
    request_interval_sec: 0.5
    pages: 3
    page_size: 20
  xiamen_cqjy:
    enabled: true             # 厦门产权交易中心 POST /cms/article/query
    group: open
    api: https://www.xemas.com.cn/cms/article/query
    root_uid: a22482fe-5ddb-44a2-af49-ebbc22c1d29b
    request_interval_sec: 0.5
    pages: 3
    page_size: 20
  cspea_national:
    enabled: true             # 全国产权行业信息化综合服务平台：SSR 列表内嵌 JSON，覆盖全国交易所
    group: open
    base: https://www.cspea.com.cn
    request_interval_sec: 0.8
    categories: [C01, C02, C03, C04, C05, C06]  # 资产转让/产权转让/企业增资/金融资产/不良资产/债权
    status: A02,A03           # 正式披露/预披露，排除已成交
    repeat: 3                 # 每类请求次数（列表在两组缓存间轮换，每次 12 条）
    max_detail: 40            # 每轮最多抓多少详情页（补评估价与来源交易所）
  fujian_cqjy:
    enabled: true             # 福建省产权交易中心：首页多栏目表格 + 站内静态详情页
    group: open
    base: https://www.fjcqjy.com
    request_interval_sec: 0.6
    max_detail: 40
  qingdao_cqjy:
    enabled: true             # 青岛产权交易所：/api/dpm/web/pro/{sys}/home（source 走路径前缀）
    group: open
    base: https://www.qdcq.net
    api: https://www.qdcq.net/api/dpm/web/pro/{sys}/home
    systems: [utrg, utrm, utrz, utrl, utri]  # 国有产权/资产转让/增资/租赁/招商
    request_interval_sec: 0.5
    pages: 2
    rows: 20
  tianjin_cqjy:
    enabled: true             # 天津产权交易中心：trade.tpre.cn project-info（8 个业务系统）
    group: open
    api: https://trade.tpre.cn/up/biz/up-data-view/anmuas/project-info
    systems: [ENTERPRISE_ASSETS, PROPERTY_RIGHT_TRANSFER, ENTERPRISE_CAPITAL_INCREASE, ENTERPRISE_INVESTMENT_ATTRACTION, JS, FINANCE, LEASE, SMALL_COMMODITY]
    request_interval_sec: 0.5
    pages: 2
    size: 20
  shenyang_cqjy:
    enabled: true             # 沈阳联合产权交易所：静态列表 xmgg.htm（编号/标题/日期）
    group: open
    base: https://www.sprtc.com
    list_path: /gghz1/xmgg.htm
    request_interval_sec: 0.5
    pages: 3

# 推送通道（密钥不要写进代码库，运行时用环境变量覆盖）
push:
  channels:
    wecom_bot: ""             # 企业微信机器人 Webhook；或用环境变量 WECOM_BOT_WEBHOOK
    dingtalk_bot: ""          # 钉钉机器人 Webhook；或环境变量 DINGTALK_BOT_WEBHOOK
    serverchan_key: ""        # Server酱 sendkey；或环境变量 SERVERCHAN_KEY
  enabled: false              # 未配置密钥时保持关闭，避免误推

# 存储
storage:
  db_path: data/listings.db   # SQLite（M1）；上量后可切云数据库
